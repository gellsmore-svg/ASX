[project]
name = "asx"
version = "0.1.0"
description = "Agent Semantic Exchange: verifiable semantic commitments between independent agents"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "gellsmore-svg"}]
keywords = ["agents", "protocol", "semantics", "arbitration"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["ruff==0.8.6", "bandit==1.8.3"]

[project.scripts]
asx-evaluate = "asx.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F"]

[tool.bandit]
exclude_dirs = ["tests", "conformance"]
skips = ["B101"]
